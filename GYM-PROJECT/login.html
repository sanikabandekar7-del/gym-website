<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="vinfo.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="GYM.CSS">
  <title>Login / Signup</title>

  <style>
    p{
      color: black;
    }
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 320px;
      height: 420px; /* fixed height */
      overflow-y: auto; /* scroll bar */
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .toggle {
      text-align: center;
      margin-top: 15px;
    }
    .toggle a {
      color: #007BFF;
      cursor: pointer;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-left">
      <img class="logo" src="GYM-LOGO.png" alt="Music Hub logo">

    </div>

    <nav class="nav-center">
      <a href="home.html" class="nav-link">HOME</a>
      <a href="plans.html" class="nav-link">MEMBERSHIP PLANS</a>
      <a href="about.html" class="nav-link">ABOUT US</a>
  
    </nav>

    <div class="nav-right">
      <a href="login.html" class="login-btn-nav">Login</a>
    </div>
  </header>
  <div class="container">
    <form id="loginForm" action="login.php" method="POST">
      <h2>Login</h2>
      <select name="role" required>
        <option value="">Select Role</option>
        <option value="trainer">Trainer</option>
        <option value="member">Member</option>
      </select>
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <div class="toggle">
        <p>Don't have an account? <a onclick="showSignup()">Sign up</a></p>
      </div>
    </form>

    <form id="signupForm" class="hidden" action="signup.php" method="POST">
      <h2>Sign Up</h2>
      <select name="role" required>
        <option value="">Select Role</option>
        <option value="trainer">Trainer</option>
        <option value="member">Member</option>
      </select>
      <input type="text" name="username" placeholder="Username" required>
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <input type="password" placeholder="Confirm Password" required>
      <input type="text" name="phone" placeholder="Phone Number" required>
      <button type="submit">Sign Up</button>
      <div class="toggle">
        <p>Already have an account? <a onclick="showLogin()">Login</a></p>
      </div>
    </form>
  </div> 
</body>
</html>
